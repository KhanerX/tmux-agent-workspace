bar {
    font pango:DejaVu Sans Mono 9
    height 22
    status_command python3 "$HOME/.config/i3/ai-usage-status.py"
    colors {
        background #05000a
        statusline #f4f7ff
        separator #c792ea
        focused_workspace #00d9ff #141020 #f4f7ff
        active_workspace #c792ea #141020 #f4f7ff
        inactive_workspace #141020 #05000a #a6a6a6
        urgent_workspace #ff2a6d #ff2a6d #f4f7ff
    }
}
