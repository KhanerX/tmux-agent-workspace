# Enable client-side shadows on windows.
shadow = true;
shadow-radius = 6;
shadow-opacity = 0.35;
shadow-offset-x = 0.5;
shadow-offset-y = 0.5;

# Fade windows in/out when opening/closing and when opacity changes.
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 10;

# Opacity settings
frame-opacity = 0.7;

# Rounded corners
corner-radius = 6;

# Background blurring
blur:
{
  method = "dual_kawase";
  strength = 4;
};
blur-background = true;
blur-background-frame = true;
blur-background-fixed = false;

# Exclude conditions for shadows and blur
shadow-exclude = [
  "class_g = 'EyeBreak'",
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g = 'Cairo-clock'",
  "_GTK_FRAME_EXTENTS@:c"
];
blur-background-exclude = [
  "class_g = 'EyeBreak'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# General settings
backend = "glx";
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;

# Window type settings
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.75; focus = true; full-shadow = false; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.8; };
  dropdown_menu = { opacity = 0.8; };
};
