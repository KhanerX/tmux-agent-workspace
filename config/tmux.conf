set -g mouse on
set -sg escape-time 0
set -g extended-keys on

# Keep the original green bar and bold only the selected window.
set -g status-style 'fg=black,bg=green'
set -g window-status-separator ''
set -g window-status-format '#[fg=black,bg=green] #I:#W #{?@agent_waiting,#[fg=red#,bg=green#,bold]● #[fg=black#,bg=green#,nobold],}'
set -g window-status-current-format '#[fg=black,bg=green,bold] #I:#W #{?@agent_waiting,#[fg=red#,bg=green#,bold]● #[fg=black#,bg=green#,bold],}'

# Acknowledging a window clears its agent attention marker.
set-hook -g after-select-window 'set-option -wu @agent_waiting'
set -g history-limit 100000

# Parking lot: keep parked windows running in a detached session.
bind-key P run-shell -b '~/bin/tmux-park park #{window_id} --session #{q:session_name}'
bind-key p run-shell -b '~/bin/tmux-park menu --session #{q:session_name}'
